<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYG3510 Læringsplattform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appbg: '#0B1121',
                        cardbg: '#1E293B',
                        innerbox: '#0F172A',
                        brandblue: '#3B82F6',
                        textmuted: '#94A3B8'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-appbg text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Toppmeny -->
    <header class="flex flex-col sm:flex-row items-center justify-between px-6 py-4 border-b border-slate-800 bg-appbg shadow-sm gap-4">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-full border border-slate-700 bg-cardbg flex items-center justify-center text-brandblue font-bold text-sm shadow-inner">
                SYG
            </div>
            <div>
                <div class="text-[10px] font-bold tracking-widest text-textmuted uppercase">NTNU Gjøvik • SYG3510</div>
                <div class="text-sm font-semibold text-slate-200">Anestesisykepleie Læringsplattform</div>
            </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
            <input type="password" id="api-key" placeholder="Gemini API-nøkkel" class="bg-cardbg border border-slate-700 text-xs px-3 py-2 rounded focus:outline-none focus:border-brandblue text-slate-300 w-48">
            <input type="text" id="topic" placeholder="Skriv tema (f.eks. TIVA)" class="bg-cardbg border border-slate-700 text-xs px-3 py-2 rounded focus:outline-none focus:border-brandblue text-slate-300 w-48">
            <button onclick="startApp()" class="bg-brandblue hover:bg-blue-600 text-white text-xs px-4 py-2 rounded font-medium transition-colors">Start Økt</button>
        </div>
    </header>

    <!-- Hovedinnhold -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-8">
        
        <!-- Velkomst / Laster-skjerm -->
        <div id="loader-view" class="text-center space-y-4 hidden">
            <div class="w-12 h-12 border-4 border-slate-800 border-t-brandblue rounded-full animate-spin mx-auto"></div>
            <p id="loader-text" class="text-slate-400 text-sm font-medium">Analyserer pensum og bygger læringssløyfe...</p>
        </div>

        <!-- App-kortet (Eksakt match med skjermbildet) -->
        <div id="app-card" class="bg-cardbg rounded-xl p-6 sm:p-8 w-full max-w-3xl shadow-2xl border border-slate-800/50 hidden">
            
            <!-- Header og Progress -->
            <div class="flex justify-between items-center mb-4">
                <span id="phase-badge" class="bg-slate-700/50 text-blue-400 text-[10px] sm:text-xs px-3 py-1.5 rounded uppercase font-bold tracking-wider">FASE 1: DIRECTED READING</span>
                <span id="step-indicator" class="text-textmuted text-xs sm:text-sm font-medium">Steg 1 av 4</span>
            </div>
            
            <div class="flex gap-2 mb-8">
                <div id="prog-1" class="h-1 flex-1 bg-brandblue rounded transition-colors duration-300"></div>
                <div id="prog-2" class="h-1 flex-1 bg-slate-700 rounded transition-colors duration-300"></div>
                <div id="prog-3" class="h-1 flex-1 bg-slate-700 rounded transition-colors duration-300"></div>
                <div id="prog-4" class="h-1 flex-1 bg-slate-700 rounded transition-colors duration-300"></div>
            </div>
            
            <!-- Dynamisk container for innhold -->
            <div id="content-container" class="min-h-[300px]">
                <!-- Innhold genereres her av JS -->
            </div>

            <!-- Footer / Navigasjon -->
            <div class="flex justify-between items-center mt-8">
                <button id="btn-prev" onclick="prevStep()" class="text-slate-500 hover:text-slate-300 text-sm font-medium transition-colors cursor-pointer hidden">Forrige</button>
                <div class="flex-grow"></div>
                <button id="btn-next" onclick="nextStep()" class="bg-brandblue hover:bg-blue-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium flex items-center gap-2 transition-colors">
                    <span id="btn-next-text">Neste: MCQ</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                </button>
            </div>
        </div>
    </main>

    <script>
        // State
        const state = {
            step: 1,
            data: null,
            answers: { mcq1: null, mcq2: null, kortsvar: "" },
            feedback: null
        };

        // DOM Elements
        const elAppCard = document.getElementById('app-card');
        const elLoader = document.getElementById('loader-view');
        const elLoaderText = document.getElementById('loader-text');
        const elContent = document.getElementById('content-container');
        const elBadge = document.getElementById('phase-badge');
        const elStep = document.getElementById('step-indicator');
        const elBtnPrev = document.getElementById('btn-prev');
        const elBtnNext = document.getElementById('btn-next');
        const elBtnNextText = document.getElementById('btn-next-text');

        // Restore API Key
        window.onload = () => {
            const savedKey = localStorage.getItem('syg_api_key');
            if(savedKey) document.getElementById('api-key').value = savedKey;
        };

        async function startApp() {
            const apiKey = document.getElementById('api-key').value.trim();
            const topic = document.getElementById('topic').value.trim();

            if (!apiKey || !topic) return alert("Fyll inn både API-nøkkel og Tema.");
            localStorage.setItem('syg_api_key', apiKey);

            elAppCard.classList.add('hidden');
            elLoader.classList.remove('hidden');
            elLoaderText.innerText = "Søker i pensum og genererer læringssløyfe...";

            const prompt = `Jeg ønsker å gjennomføre en interaktiv læringsøkt for faget Anestesisykepleie 1 (SYG3510) ved NTNU Gjøvik. 
Hovedtema: "${topic}"

KILDEBRUK OG HIERARKI:
1. Primærkilder: "Anestesisykepleie" (Leonardsen), "Nurse Anesthesia" (Elisha), "Menneskekroppen", og Norsk Standard for Anestesi (NSA).

Du fungerer som backend for en app. Du MÅ returnere KUN et rent, gyldig JSON-objekt med nøyaktig denne strukturen (ingen markdown utenfor JSON):
{
  "undertema_tittel": "Spesifikt og elementært undertema",
  "fase1_leseoppdrag": "Kort og presist leseoppdrag hentet fra kildene.",
  "fase1_lenketekst": "Beskrivende navn på relevant nettressurs (f.eks NSA)",
  "fase1_lenkeurl": "https://www.anestesi.no eller lignende",
  "fase1_kildekritikk": "Kort kildekritisk merknad om kildens type.",
  "fase2_sporsmal1": "Første flervalgsspørsmål om fysiologi.",
  "fase2_alt1": ["A", "B", "C", "D"],
  "fase2_fasit1": 0,
  "fase2_sporsmal2": "Andre flervalgsspørsmål.",
  "fase2_alt2": ["A", "B", "C", "D"],
  "fase2_fasit2": 2,
  "fase3_kasuistikk": "Kort klinisk kasuistikk.",
  "fase3_sporsmal": "Åpent spørsmål (krever fysiologisk forklaring)."
}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const resData = await response.json();
                let textRes = resData.candidates[0].content.parts[0].text;
                textRes = textRes.replace(/```json/g, '').replace(/```/g, '').trim();
                
                state.data = JSON.parse(textRes);
                state.step = 1;
                state.answers = { mcq1: null, mcq2: null, kortsvar: "" };
                
                elLoader.classList.add('hidden');
                elAppCard.classList.remove('hidden');
                renderStep();
            } catch(e) {
                console.error(e);
                alert("Feil ved generering. Sjekk API-nøkkel og prøv igjen.");
                elLoader.classList.add('hidden');
            }
        }

        function renderStep() {
            // Update Progress Bar
            for(let i=1; i<=4; i++) {
                document.getElementById(`prog-${i}`).className = i <= state.step 
                    ? 'h-1 flex-1 bg-brandblue rounded transition-colors duration-300' 
                    : 'h-1 flex-1 bg-slate-700 rounded transition-colors duration-300';
            }
            
            elStep.innerText = `Steg ${state.step} av 4`;

            if (state.step === 1) {
                elBadge.innerText = "FASE 1: DIRECTED READING";
                elBtnPrev.classList.add('hidden');
                elBtnNextText.innerText = "Neste: MCQ";
                
                elContent.innerHTML = `
                    <h3 class="text-brandblue text-xs font-bold uppercase tracking-wider mb-2">Pensumstyrt forberedelse</h3>
                    <h1 class="text-white text-xl sm:text-2xl font-semibold mb-6">${state.data.undertema_tittel}</h1>
                    
                    <div class="bg-innerbox rounded-lg p-5 mb-4 text-slate-300 leading-relaxed text-sm shadow-inner">
                        ${state.data.fase1_leseoppdrag}
                    </div>
                    
                    <a href="${state.data.fase1_lenkeurl}" target="_blank" class="inline-flex items-center gap-2 text-brandblue text-sm mb-6 hover:underline">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                        ${state.data.fase1_lenketekst}
                    </a>
                    
                    <div class="bg-innerbox/50 border border-slate-700/50 rounded-lg p-4 text-textmuted text-xs leading-relaxed">
                        <span class="font-bold text-slate-300">Kildekritisk merknad:</span> ${state.data.fase1_kildekritikk}
                    </div>
                `;
            } 
            else if (state.step === 2) {
                elBadge.innerText = "FASE 2: KUNNSKAPSVERIFISERING";
                elBtnPrev.classList.remove('hidden');
                elBtnNextText.innerText = "Neste: Kasuistikk";
                
                elContent.innerHTML = `
                    <h3 class="text-brandblue text-xs font-bold uppercase tracking-wider mb-6">Test din forståelse</h3>
                    
                    <div class="space-y-6">
                        <!-- Spørsmål 1 -->
                        <div>
                            <p class="text-slate-200 font-medium mb-3 text-sm sm:text-base">1. ${state.data.fase2_sporsmal1}</p>
                            <div class="grid grid-cols-1 gap-2">
                                ${state.data.fase2_alt1.map((alt, i) => `
                                    <div onclick="selectMCQ(1, ${i})" class="flex items-center gap-4 p-3 rounded-lg border cursor-pointer transition-colors ${state.answers.mcq1 === i ? 'bg-slate-800 border-brandblue' : 'bg-innerbox border-slate-800 hover:border-slate-600'}">
                                        <div class="w-6 h-6 rounded bg-slate-800 text-xs flex items-center justify-center font-bold text-textmuted">${['A','B','C','D'][i]}</div>
                                        <div class="text-sm text-slate-300">${alt}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <!-- Spørsmål 2 -->
                        <div class="pt-4 border-t border-slate-800/50">
                            <p class="text-slate-200 font-medium mb-3 text-sm sm:text-base">2. ${state.data.fase2_sporsmal2}</p>
                            <div class="grid grid-cols-1 gap-2">
                                ${state.data.fase2_alt2.map((alt, i) => `
                                    <div onclick="selectMCQ(2, ${i})" class="flex items-center gap-4 p-3 rounded-lg border cursor-pointer transition-colors ${state.answers.mcq2 === i ? 'bg-slate-800 border-brandblue' : 'bg-innerbox border-slate-800 hover:border-slate-600'}">
                                        <div class="w-6 h-6 rounded bg-slate-800 text-xs flex items-center justify-center font-bold text-textmuted">${['A','B','C','D'][i]}</div>
                                        <div class="text-sm text-slate-300">${alt}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
            else if (state.step === 3) {
                elBadge.innerText = "FASE 3: KOGNITIV PROSESSERING";
                elBtnPrev.classList.remove('hidden');
                elBtnNextText.innerText = "Evaluer (Fase 4)";
                
                elContent.innerHTML = `
                    <h3 class="text-brandblue text-xs font-bold uppercase tracking-wider mb-2">Klinisk Kasuistikk</h3>
                    <div class="bg-innerbox rounded-lg p-5 mb-6 text-slate-300 text-sm shadow-inner leading-relaxed">
                        ${state.data.fase3_kasuistikk}
                    </div>
                    <p class="text-slate-200 font-medium mb-3 text-sm sm:text-base">${state.data.fase3_sporsmal}</p>
                    <textarea onchange="state.answers.kortsvar = this.value" placeholder="Forklar fysiologisk (3-6 setninger)..." class="w-full bg-innerbox border border-slate-700 text-slate-200 p-4 rounded-lg focus:outline-none focus:border-brandblue text-sm min-h-[120px] resize-y">${state.answers.kortsvar}</textarea>
                `;
            }
            else if (state.step === 4) {
                elBadge.innerText = "FASE 4: ALGORITMISK FEEDBACK";
                elBtnPrev.classList.add('hidden');
                elBtnNextText.innerText = "Ferdig / Ny Økt";
                
                const m1 = state.answers.mcq1 === state.data.fase2_fasit1;
                const m2 = state.answers.mcq2 === state.data.fase2_fasit2;

                elContent.innerHTML = `
                    <h3 class="text-brandblue text-xs font-bold uppercase tracking-wider mb-6">Sensur og Pensumforankring</h3>
                    <div class="space-y-4">
                        <div class="bg-innerbox border ${m1 ? 'border-green-900/50' : 'border-red-900/50'} rounded-lg p-4 text-sm">
                            <span class="font-bold ${m1 ? 'text-green-500' : 'text-red-500'}">${m1 ? '✓ Riktig' : '✗ Feil'} (Spm 1):</span> 
                            <span class="text-slate-300">${state.feedback.mcq1_feedback}</span>
                        </div>
                        <div class="bg-innerbox border ${m2 ? 'border-green-900/50' : 'border-red-900/50'} rounded-lg p-4 text-sm">
                            <span class="font-bold ${m2 ? 'text-green-500' : 'text-red-500'}">${m2 ? '✓ Riktig' : '✗ Feil'} (Spm 2):</span> 
                            <span class="text-slate-300">${state.feedback.mcq2_feedback}</span>
                        </div>
                        <div class="bg-slate-800/50 border border-slate-700 rounded-lg p-5 mt-6 text-sm">
                            <h4 class="font-bold text-white mb-2">Tilbakemelding på kortsvar:</h4>
                            <p class="text-slate-400 italic mb-4 pb-4 border-b border-slate-700">" ${state.answers.kortsvar} "</p>
                            <div class="text-slate-200 leading-relaxed">${state.feedback.kortsvar_feedback}</div>
                        </div>
                    </div>
                `;
            }
        }

        function selectMCQ(questionNum, altIndex) {
            if(questionNum === 1) state.answers.mcq1 = altIndex;
            if(questionNum === 2) state.answers.mcq2 = altIndex;
            renderStep();
        }

        async function nextStep() {
            if (state.step === 2) {
                if(state.answers.mcq1 === null || state.answers.mcq2 === null) return alert("Svar på begge flervalgsspørsmålene.");
                state.step++; renderStep();
            } 
            else if (state.step === 3) {
                if(!state.answers.kortsvar.trim()) return alert("Du må skrive et svar på kasuistikken.");
                await fetchEvaluation();
            } 
            else if (state.step === 4) {
                location.reload();
            } 
            else {
                state.step++; renderStep();
            }
        }

        function prevStep() {
            if (state.step > 1) { state.step--; renderStep(); }
        }

        async function fetchEvaluation() {
            const apiKey = localStorage.getItem('syg_api_key');
            elAppCard.classList.add('hidden');
            elLoader.classList.remove('hidden');
            elLoaderText.innerText = "Evaluerer med vitenskapelige markører...";

            const evalPrompt = `Evaluer studentens svar. 
Tema: ${state.data.undertema_tittel}
Student MCQ 1: Valgte alt. index ${state.answers.mcq1} (Fasit index: ${state.data.fase2_fasit1})
Student MCQ 2: Valgte alt. index ${state.answers.mcq2} (Fasit index: ${state.data.fase2_fasit2})
Student Kortsvar: "${state.answers.kortsvar}"

Krav til sensur (FASE 4):
1. Gi konkret pensumhenvisning ved feil i MCQ.
2. Analyser kortsvaret patofysiologisk. Bruk vitenskapelige markører som [Documented fact] eller [Professional consensus].

Returner KUN JSON:
{
  "mcq1_feedback": "Kort forklaring.",
  "mcq2_feedback": "Kort forklaring.",
  "kortsvar_feedback": "Din faglige tilbakemelding her (bruk gjerne HTML <br> for avsnitt)."
}`;
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: evalPrompt }] }] })
                });
                const resData = await response.json();
                let textRes = resData.candidates[0].content.parts[0].text;
                textRes = textRes.replace(/```json/g, '').replace(/```/g, '').trim();
                
                state.feedback = JSON.parse(textRes);
                state.step = 4;
                elLoader.classList.add('hidden');
                elAppCard.classList.remove('hidden');
                renderStep();
            } catch(e) {
                console.error(e);
                alert("Feil under evaluering. Prøv igjen.");
                elLoader.classList.add('hidden');
                elAppCard.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
