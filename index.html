<!DOCTYPE html>
<html lang="no" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anestesi Læringsverktøy – NTNU Gjøvik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f1115',
                        cardBg: '#16181d',
                        accentBlue: '#2563eb',
                        hoverBlue: '#1d4ed8',
                        success: '#16a34a',
                        error: '#dc2626'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkBg text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased">

    <!-- Toppmeny med API-nøkkel innstilling -->
    <header class="bg-cardBg border-b border-slate-800 p-4 shadow-md">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-medium flex items-center gap-2 text-slate-200">
                <span class="text-accentBlue">🫀</span> Anestesisykepleie 1 (SYG3510)
            </h1>
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <input type="password" id="apiKeyInput" placeholder="Lim inn Gemini API-nøkkel..." 
                    class="bg-darkBg border border-slate-700 text-xs px-3 py-2 rounded-lg focus:outline-none focus:border-accentBlue w-full sm:w-64 text-slate-300">
                <button onclick="saveApiKey()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2 rounded-lg font-medium transition">
                    Lagre
                </button>
            </div>
        </div>
    </header>

    <!-- Hovedinnhold -->
    <main class="max-w-4xl w-full mx-auto p-4 sm:p-6 my-auto flex-grow flex items-center justify-center">
        <div id="app" class="w-full">
            
            <!-- Visning 1: Startside -->
            <div id="view-home" class="bg-cardBg border border-slate-800 rounded-2xl p-8 sm:p-12 shadow-2xl max-w-2xl mx-auto space-y-6">
                <div>
                    <h2 class="text-2xl font-semibold mb-2 text-slate-100">Klar for en ny læringssløyfe?</h2>
                    <p class="text-slate-400 text-sm">Skriv inn et pensumtema. Systemet vil hente ut et leseoppdrag, generere MCQ og en klinisk case for å teste din patofysiologiske forståelse.</p>
                </div>
                <div>
                    <input type="text" id="topicInput" placeholder="F.eks. TIVA, Kardiogent sjokk, PEEP..." 
                        class="w-full bg-darkBg border border-slate-700 text-slate-100 p-4 rounded-xl focus:outline-none focus:border-accentBlue focus:ring-1 focus:ring-accentBlue text-base">
                </div>
                <button onclick="startLearningLoop()" class="w-full bg-accentBlue hover:bg-hoverBlue text-white font-medium py-4 rounded-xl transition shadow-lg">
                    Generer Læringsøkt
                </button>
            </div>

            <!-- Visning 2: Laster inn -->
            <div id="view-loading" class="hidden text-center py-20 space-y-4">
                <div class="inline-block animate-spin text-accentBlue text-4xl border-4 border-slate-700 border-t-accentBlue rounded-full w-12 h-12"></div>
                <h3 id="loadingText" class="text-lg font-medium text-slate-200">Analyserer pensum og bygger oppgaver...</h3>
            </div>

            <!-- Visning 3: Interaktiv Læringssløyfe (Skjermbilde-design) -->
            <div id="view-quiz" class="hidden bg-cardBg border border-slate-800 rounded-2xl p-6 sm:p-10 shadow-2xl space-y-8">
                
                <!-- Progress Header -->
                <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-4 border-b border-slate-800 pb-4">
                    <h2 id="quizTopicTitle" class="text-lg sm:text-xl font-medium text-slate-200">Tema</h2>
                    <div class="flex items-center gap-4 text-sm font-medium">
                        <div class="w-32 bg-slate-800 h-1.5 rounded-full overflow-hidden">
                            <div id="progressBar" class="bg-accentBlue h-full w-1/4 transition-all duration-300"></div>
                        </div>
                        <span id="quizProgress" class="text-slate-400">1/4</span>
                    </div>
                </div>

                <!-- Dynamisk innhold -->
                <div id="quizContent" class="space-y-6 min-h-[250px]">
                    <!-- Innhold injiseres via JavaScript -->
                </div>

                <!-- Navigasjon -->
                <div class="flex justify-between pt-6 border-t border-slate-800 items-center">
                    <button id="prevBtn" onclick="prevStep()" class="text-slate-400 hover:text-slate-200 px-4 py-2 rounded-xl text-sm font-medium transition hidden">Tilbake</button>
                    <div class="flex-grow"></div> <!-- Spacer -->
                    <button id="nextBtn" onclick="nextStep()" class="bg-accentBlue hover:bg-hoverBlue text-white px-8 py-2.5 rounded-full text-sm font-medium transition shadow-md">Neste</button>
                </div>
            </div>

        </div>
    </main>

    <!-- JavaScript Logikk -->
    <script>
        let currentStep = 1;
        let loopData = null;
        let userAnswers = { mcq: null, text: "" };
        let evaluationData = null;

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value;
            if(key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API-nøkkel lagret lokalt.');
            }
        }

        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if(savedKey) document.getElementById('apiKeyInput').value = savedKey;
        }

        async function startLearningLoop() {
            const topic = document.getElementById('topicInput').value;
            const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value;

            if(!topic) return alert('Skriv inn et tema først.');
            if(!apiKey) return alert('Du må legge inn en Gemini API-nøkkel øverst til høyre.');

            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-loading').classList.remove('hidden');
            document.getElementById('loadingText').innerText = "Bygger oppgaver basert på pensum...";

            try {
                // API KALL 1: Generer oppgavene
                const prompt = `Lag en interaktiv læringssløyfe for faget Anestesisykepleie 1 (NTNU). Tema: "${topic}".
                Returner KUN et gyldig JSON-objekt på dette formatet (ingen markdown utenfor JSON):
                {
                  "title": "Kort og presis tittel på tema",
                  "fase1_leseoppdrag": "Kort leseoppdrag fra faglitteratur. Nevn fysiologiske prinsipper.",
                  "fase2_sporsmal": "Et flervalgsspørsmål (MCQ) for å teste kunnskap.",
                  "fase2_alternativer": ["Alternativ 1", "Alternativ 2", "Alternativ 3", "Alternativ 4"],
                  "fase2_fasit_index": 0,
                  "fase3_kasuistikk": "Kort klinisk case og et spørsmål som krever en patofysiologisk forklaring."
                }`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                let textResponse = data.candidates[0].content.parts[0].text;
                textResponse = textResponse.replace(/```json/g, '').replace(/
